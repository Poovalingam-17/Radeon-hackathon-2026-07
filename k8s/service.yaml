apiVersion: v1
kind: Service
metadata:
  name: guardianai-backend
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: guardianai-backend
---
apiVersion: v1
kind: Service
metadata:
  name: guardianai-frontend
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: guardianai-frontend
