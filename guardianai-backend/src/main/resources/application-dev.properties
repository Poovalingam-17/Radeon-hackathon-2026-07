# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/guardianai_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=poova2005@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Logging Configurations
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.guardianai=DEBUG
